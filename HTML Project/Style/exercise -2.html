<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Flex-Box_04</title>

  <style>


    section{
      width: 100%;
      height: 500px;
      border: 5px solid chocolate;

      display: flex;
      justify-content: space-evenly;
      /*justify-content: center;*/
      /*align-items: center;*/
    }

    section>div{
      width: 200px;
      aspect-ratio: 1/1;
      background: orange;

      /*align-self: self-start;*/
      /*align-self: self-end;*/
      /*align-self: center;*/
      border: 5px solid pink;

    }

    section>div:first-child{
      align-self: self-start;
    }

    section>div:nth-child(2){
      align-self: center;
    }

    section>div:nth-child(3){
      align-self: self-end;
    }

    section>div:nth-child(4){
       align-self: center;
     }
    section>div:nth-child(5){
      align-self: self-start;
    }
    section>div:nth-child(6){
      align-self: center;
    }



  </style>
</head>
<body>


<section>
  <div></div>
  <div></div>
  <div></div>
  <div></div>
  <div></div>
  <div></div>
</section>



</body>
</html>
